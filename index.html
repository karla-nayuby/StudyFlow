<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Organização Inteligente de Estudos</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ==========================================================================
       1. VARIÁVEIS E TEMAS (UI & ACESSIBILIDADE)
       ========================================================================== */
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --secondary: #06B6D4;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-border: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      
      --success: #10B981;
      --success-light: #ECFDF5;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --danger: #EF4444;
      --danger-light: #FEF2F2;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);

      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0F172A;
      --surface: #1E293B;
      --surface-border: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --primary-light: #1E1B4B;
    }

    /* Base Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      line-height: 1.5;
      font-size: 1rem;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Focus visible para Acessibilidade (WCAG 2.1) */
    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* Skip Link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--primary);
      color: white;
      padding: 8px 16px;
      z-index: 9999;
      text-decoration: none;
      border-radius: 0 0 var(--radius-sm) 0;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 0; }

    /* ==========================================================================
       2. LAYOUT & NAVEGAÇÃO
       ========================================================================== */
    .app-container {
      display: flex;
      width: 100vw;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sidebar - Desktop */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      position: fixed;
      height: 100vh;
      z-index: 100;
      transition: var(--transition);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 2rem;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: var(--transition);
      min-height: 48px; /* Acessibilidade Touch Target */
    }

    .nav-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
    }

    .sidebar-footer {
      border-top: 1px solid var(--surface-border);
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 2rem;
      max-width: 1200px;
      padding-bottom: 5rem; /* Espaço para nav mobile */
    }

    /* Mobile Bottom Navigation */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--surface-border);
      padding: 0.5rem 1rem;
      justify-content: space-around;
      z-index: 100;
      box-shadow: var(--shadow-lg);
    }

    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.5rem;
      min-width: 48px;
      min-height: 48px;
    }

    .mobile-nav-btn.active {
      color: var(--primary);
      font-weight: 600;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .top-bar h1 {
      font-size: 1.75rem;
      font-weight: 700;
    }

    /* ==========================================================================
       3. COMPONENTES & CARDS
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      min-height: 48px;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
    }
    .btn-secondary:hover { background: var(--primary-light); }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
    }

    /* Grid Dashboard */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
    }

    .stat-info h3 { font-size: 0.875rem; color: var(--text-muted); font-weight: 500; }
    .stat-info p { font-size: 1.5rem; font-weight: 700; }

    /* Barra de Progresso */
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: var(--surface-border);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Lista de Tarefas & Gestos Touch */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      margin-bottom: 0.75rem;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      touch-action: pan-y;
      user-select: none;
    }

    .task-item:hover {
      box-shadow: var(--shadow-md);
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
    }

    .checkbox-custom {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid var(--surface-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .task-item.completed .checkbox-custom {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-high { background: var(--danger-light); color: var(--danger); }
    .badge-med { background: var(--warning-light); color: var(--warning); }
    .badge-low { background: var(--primary-light); color: var(--primary); }

    /* Visualização em Matérias Grid */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .subject-card {
      border-top: 5px solid var(--primary);
    }

    /* Visualização Calendário */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      text-align: center;
    }

    .calendar-day-header {
      font-weight: 600;
      padding: 0.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .calendar-day {
      min-height: 90px;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: var(--surface);
    }

    .calendar-day.today {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .calendar-event {
      font-size: 0.7rem;
      background: var(--primary);
      color: white;
      padding: 2px 4px;
      border-radius: 4px;
      margin-top: 4px;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Estado Vazio */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-state i {
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--surface-border);
      background: var(--bg);
      color: var(--text-main);
      font-size: 1rem;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 5rem;
      right: 1.5rem;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background: var(--text-main);
      color: var(--bg);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Onboarding Overlay */
    .onboarding-card {
      text-align: center;
      max-width: 400px;
    }

    /* Filtros e Busca */
    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    /* Mobile Responsive Breakpoints */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main-content { margin-left: 0; padding: 1rem; }
      .toast-container { bottom: 5rem; right: 1rem; left: 1rem; }
    }
  </style>
</head>
<body>

  <a href="#main-view" class="skip-link">Pular para o conteúdo principal</a>

  <div class="app-container">
    <!-- Sidebar Desktop -->
    <nav class="sidebar" aria-label="Navegação Principal">
      <div class="brand">
        <i data-lucide="book-open-check"></i>
        <span>StudyFlow</span>
      </div>
      <ul class="nav-list">
        <li>
          <button class="nav-btn active" data-view="dashboard" onclick="switchView('dashboard')">
            <i data-lucide="layout-dashboard"></i> Dashboard
          </button>
        </li>
        <li>
          <button class="nav-btn" data-view="tasks" onclick="switchView('tasks')">
            <i data-lucide="check-square"></i> Tarefas
          </button>
        </li>
        <li>
          <button class="nav-btn" data-view="subjects" onclick="switchView('subjects')">
            <i data-lucide="folder"></i> Matérias
          </button>
        </li>
        <li>
          <button class="nav-btn" data-view="calendar" onclick="switchView('calendar')">
            <i data-lucide="calendar"></i> Calendário
          </button>
        </li>
        <li>
          <button class="nav-btn" data-view="notes" onclick="switchView('notes')">
            <i data-lucide="lock"></i> Notas Privadas
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-secondary" onclick="toggleTheme()" style="width: 100%;">
          <i data-lucide="moon" id="theme-icon"></i> Alternar Tema
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-view" class="main-content" tabIndex="-1">
      <!-- O conteúdo é injetado dinamicamente via JS -->
    </main>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav" aria-label="Navegação Mobile">
      <button class="mobile-nav-btn active" data-view="dashboard" onclick="switchView('dashboard')">
        <i data-lucide="layout-dashboard"></i> Home
      </button>
      <button class="mobile-nav-btn" data-view="tasks" onclick="switchView('tasks')">
        <i data-lucide="check-square"></i> Tarefas
      </button>
      <button class="mobile-nav-btn" data-view="subjects" onclick="switchView('subjects')">
        <i data-lucide="folder"></i> Matérias
      </button>
      <button class="mobile-nav-btn" data-view="calendar" onclick="switchView('calendar')">
        <i data-lucide="calendar"></i> Agenda
      </button>
      <button class="mobile-nav-btn" data-view="notes" onclick="switchView('notes')">
        <i data-lucide="lock"></i> Notas
      </button>
    </nav>
  </div>

  <!-- Modal Global de Cadastro de Tarefa -->
  <div class="modal-overlay" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 1rem;">Nova Tarefa</h2>
      <form id="task-form" onsubmit="handleSaveTask(event)">
        <div class="form-group">
          <label for="task-title-input">Título da Tarefa</label>
          <input type="text" id="task-title-input" class="form-control" required placeholder="Ex: Ler capítulo 3 de História">
        </div>
        <div class="form-group">
          <label for="task-subject-input">Matéria</label>
          <select id="task-subject-input" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label for="task-date-input">Data de Entrega</label>
          <input type="date" id="task-date-input" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="task-priority-input">Prioridade</label>
          <select id="task-priority-input" class="form-control">
            <option value="low">Baixa</option>
            <option value="med">Média</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('task-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Global de Cadastro de Matéria -->
  <div class="modal-overlay" id="subject-modal" role="dialog" aria-modal="true" aria-labelledby="subject-modal-title">
    <div class="modal-content">
      <h2 id="subject-modal-title" style="margin-bottom: 1rem;">Nova Matéria</h2>
      <form id="subject-form" onsubmit="handleSaveSubject(event)">
        <div class="form-group">
          <label for="subject-name-input">Nome da Matéria</label>
          <input type="text" id="subject-name-input" class="form-control" required placeholder="Ex: Matemática Discreta">
        </div>
        <div class="form-group">
          <label for="subject-color-input">Cor de Identificação</label>
          <input type="color" id="subject-color-input" class="form-control" value="#4F46E5" style="height: 48px;">
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('subject-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Matéria</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Onboarding -->
  <div class="modal-overlay" id="onboarding-modal" role="dialog" aria-modal="true">
    <div class="modal-content onboarding-card">
      <div class="stat-icon" style="margin: 0 auto 1rem auto; width: 64px; height: 64px;">
        <i data-lucide="sparkles" style="width: 32px; height: 32px;"></i>
      </div>
      <h2>Bem-vindo ao StudyFlow!</h2>
      <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem 0; font-size: 0.95rem;">
        Sua plataforma completa para organizar estudos, prazos e prioridades sem complicação.
      </p>
      <button class="btn btn-primary" style="width: 100%;" onclick="finishOnboarding()">Começar Agora</button>
    </div>
  </div>

  <!-- Container de Toasts -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- ==========================================================================
       4. LÓGICA JAVASCRIPT (STATE, UX, BIOMETRIA & ACESSIBILIDADE)
       ========================================================================== */
  <script>
    // ESTADO DA APLICAÇÃO (Single Source of Truth)
    let state = {
      currentView: 'dashboard',
      subjects: JSON.parse(localStorage.getItem('studyflow_subjects')) || [
        { id: '1', name: 'História', color: '#EF4444' },
        { id: '2', name: 'Cálculo I', color: '#4F46E5' },
        { id: '3', name: 'Programação', color: '#10B981' }
      ],
      tasks: JSON.parse(localStorage.getItem('studyflow_tasks')) || [
        { id: '101', title: 'Resumo sobre Revolução Industrial', subjectId: '1', date: '2026-09-25', priority: 'high', completed: false },
        { id: '102', title: 'Exercícios de Derivadas', subjectId: '2', date: '2026-09-21', priority: 'med', completed: true },
        { id: '103', title: 'Projeto de Front-end', subjectId: '3', date: '2026-09-30', priority: 'high', completed: false }
      ],
      notes: localStorage.getItem('studyflow_notes') || '',
      notesUnlocked: false,
      filterSubject: 'all',
      searchQuery: ''
    };

    // INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      checkOnboarding();
      render();
    });

    function saveState() {
      localStorage.setItem('studyflow_subjects', JSON.stringify(state.subjects));
      localStorage.setItem('studyflow_tasks', JSON.stringify(state.tasks));
      localStorage.setItem('studyflow_notes', state.notes);
    }

    // NAVEGAÇÃO E VIEWS
    function switchView(viewName) {
      triggerHapticFeedback();
      state.currentView = viewName;
      
      // Atualizar botões de navegação
      document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
        if(btn.dataset.view === viewName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      render();
    }

    // RENDERIZADOR PRINCIPAL
    function render() {
      const main = document.getElementById('main-view');
      switch (state.currentView) {
        case 'dashboard':
          main.innerHTML = renderDashboard();
          break;
        case 'tasks':
          main.innerHTML = renderTasksView();
          break;
        case 'subjects':
          main.innerHTML = renderSubjectsView();
          break;
        case 'calendar':
          main.innerHTML = renderCalendarView();
          break;
        case 'notes':
          main.innerHTML = renderNotesView();
          break;
      }
      lucide.createIcons();
    }

    // FEEDBACK HÁPTICO E SONORO
    function triggerHapticFeedback() {
      if ('vibrate' in navigator) {
        navigator.vibrate(15);
      }
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<i data-lucide="check-circle-2" style="width:18px"></i> ${message}`;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 3000);
    }

    // ONBOARDING
    function checkOnboarding() {
      if (!localStorage.getItem('studyflow_onboarded')) {
        document.getElementById('onboarding-modal').classList.add('active');
      }
    }

    function finishOnboarding() {
      localStorage.setItem('studyflow_onboarded', 'true');
      closeModal('onboarding-modal');
      showToast('Bem-vindo ao StudyFlow!');
    }

    // COMPONENTES DE VISUALIZAÇÃO (VIEWS)
    function renderDashboard() {
      const total = state.tasks.length;
      const completed = state.tasks.filter(t => t.completed).length;
      const pending = total - completed;
      const progressPercent = total === 0 ? 0 : Math.round((completed / total) * 100);

      const upcomingTasks = [...state.tasks]
        .filter(t => !t.completed)
        .sort((a,b) => new Date(a.date) - new Date(b.date))
        .slice(0, 3);

      return `
        <div class="top-bar">
          <div>
            <h1>Painel Geral</h1>
            <p style="color: var(--text-muted)">Acompanhe suas metas de estudo para esta semana.</p>
          </div>
          <button class="btn btn-primary" onclick="openTaskModal()">
            <i data-lucide="plus"></i> Nova Tarefa
          </button>
        </div>

        <div class="dashboard-grid">
          <div class="card stat-card">
            <div class="stat-icon"><i data-lucide="clock"></i></div>
            <div class="stat-info">
              <h3>Pendentes</h3>
              <p>${pending}</p>
            </div>
          </div>
          <div class="card stat-card">
            <div class="stat-icon" style="background: var(--success-light); color: var(--success);"><i data-lucide="check-circle"></i></div>
            <div class="stat-info">
              <h3>Concluídas</h3>
              <p>${completed}</p>
            </div>
          </div>
          <div class="card stat-card">
            <div class="stat-icon"><i data-lucide="book"></i></div>
            <div class="stat-info">
              <h3>Matérias</h3>
              <p>${state.subjects.length}</p>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>Progresso Geral dos Estudos</h3>
          <div style="display:flex; justify-content:space-between; margin-top:0.5rem; font-weight:600;">
            <span>${progressPercent}% concluído</span>
            <span>${completed}/${total} Tarefas</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
          </div>
        </div>

        <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Próximas Entregas</h2>
        ${upcomingTasks.length === 0 ? renderEmptyState('Nenhuma entrega pendente!') : upcomingTasks.map(task => renderTaskItemHTML(task)).join('')}
      `;
    }

    function renderTasksView() {
      let filtered = state.tasks.filter(t => {
        const matchesSubject = state.filterSubject === 'all' || t.subjectId === state.filterSubject;
        const matchesSearch = t.title.toLowerCase().includes(state.searchQuery.toLowerCase());
        return matchesSubject && matchesSearch;
      });

      return `
        <div class="top-bar">
          <h1>Gerenciador de Tarefas</h1>
          <button class="btn btn-primary" onclick="openTaskModal()">
            <i data-lucide="plus"></i> Adicionar Tarefa
          </button>
        </div>

        <div class="filter-bar">
          <input type="text" class="form-control" placeholder="Buscar tarefas..." style="flex: 1; min-width: 200px;" value="${state.searchQuery}" oninput="handleSearch(this.value)">
          <select class="form-control" style="width: auto;" onchange="handleFilterSubject(this.value)">
            <option value="all">Todas as Matérias</option>
            ${state.subjects.map(s => `<option value="${s.id}" ${state.filterSubject === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
          </select>
        </div>

        <div>
          ${filtered.length === 0 ? renderEmptyState('Nenhuma tarefa encontrada.') : filtered.map(task => renderTaskItemHTML(task)).join('')}
        </div>
      `;
    }

    function renderSubjectsView() {
      return `
        <div class="top-bar">
          <h1>Minhas Matérias</h1>
          <button class="btn btn-primary" onclick="openSubjectModal()">
            <i data-lucide="plus"></i> Cadastrar Matéria
          </button>
        </div>

        <div class="subjects-grid">
          ${state.subjects.length === 0 ? renderEmptyState('Nenhuma matéria cadastrada.') : state.subjects.map(sub => {
            const count = state.tasks.filter(t => t.subjectId === sub.id).length;
            return `
              <div class="card subject-card" style="border-top-color: ${sub.color}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <h3>${sub.name}</h3>
                  <button class="btn-secondary" style="border:none; padding: 4px;" onclick="deleteSubject('${sub.id}')" aria-label="Excluir matéria ${sub.name}">
                    <i data-lucide="trash-2" style="width:16px; color:var(--danger)"></i>
                  </button>
                </div>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">${count} tarefa(s) associada(s)</p>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCalendarView() {
      const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      
      return `
        <div class="top-bar">
          <h1>Visão em Calendário</h1>
        </div>
        <div class="card">
          <p style="margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-muted)">Visualização rápida do mês atual</p>
          <div class="calendar-grid">
            ${days.map(d => `<div class="calendar-day-header">${d}</div>`).join('')}
            ${Array.from({length: 31}).map((_, i) => {
              const dayNum = i + 1;
              const dateStr = `2026-09-${dayNum.toString().padStart(2, '0')}`;
              const dayTasks = state.tasks.filter(t => t.date === dateStr);
              const isToday = dayNum === 19; // Simulação da data atual

              return `
                <div class="calendar-day ${isToday ? 'today' : ''}">
                  <span style="font-weight:600; font-size: 0.8rem;">${dayNum}</span>${dayTasks.map(t => `<div class="calendar-event" title="${t.title}">${t.title}</div>`).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderNotesView() {
      if (!state.notesUnlocked) {
        return `
          <div class="top-bar">
            <h1>Área Privada de Anotações</h1>
          </div>
          <div class="card empty-state">
            <i data-lucide="shield-lock" style="width: 48px; height: 48px; color: var(--primary)"></i>
            <h2>Anotações Protegidas</h2>
            <p style="margin: 0.5rem 0 1.5rem 0;">Autentique-se via biometria/PIN para acessar suas notas confidenciais de estudo.</p>
            <button class="btn btn-primary" onclick="unlockNotes()">
              <i data-lucide="fingerprint"></i> Autenticar com Biometria
            </button>
          </div>
        `;
      }

      return `
        <div class="top-bar">
          <h1>Área Privada de Anotações</h1>
          <button class="btn btn-secondary" onclick="lockNotes()">
            <i data-lucide="lock"></i> Bloquear
          </button>
        </div>
        <div class="card">
          <div class="form-group">
            <label for="private-notes-input">Suas anotações (salvas automaticamente)</label>
            <textarea id="private-notes-input" class="form-control" rows="10" placeholder="Escreva aqui ideias de projetos, senhas de portais de aula..." oninput="handleSaveNotes(this.value)">${state.notes}</textarea>
          </div>
        </div>
      `;
    }

    function renderTaskItemHTML(task) {
      const subject = state.subjects.find(s => s.id === task.subjectId) || { name: 'Geral' };
      const priorityClass = task.priority === 'high' ? 'badge-high' : task.priority === 'med' ? 'badge-med' : 'badge-low';
      const priorityLabel = task.priority === 'high' ? 'Alta' : task.priority === 'med' ? 'Média' : 'Baixa';

      return `
        <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}" 
             ontouchstart="handleTouchStart(event, '${task.id}')" 
             ontouchend="handleTouchEnd(event, '${task.id}')">
          <div class="task-main">
            <button class="checkbox-custom" onclick="toggleTask('${task.id}')" aria-label="Marcar tarefa ${task.title} como concluída">
              ${task.completed ? '<i data-lucide="check" style="width: 16px;"></i>' : ''}
            </button>
            <div>
              <div class="task-title" style="font-weight: 600;">${task.title}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 0.5rem; align-items: center; margin-top: 2px;">
                <span>${subject.name}</span> • <span><i data-lucide="calendar" style="width: 12px; display:inline;"></i> ${task.date}</span>
              </div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="badge ${priorityClass}">${priorityLabel}</span>
            <button class="btn-secondary" style="border:none; padding: 6px;" onclick="deleteTask('${task.id}')" aria-label="Excluir tarefa">
              <i data-lucide="trash-2" style="width: 16px; color: var(--danger)"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderEmptyState(message) {
      return `
        <div class="card empty-state">
          <i data-lucide="inbox" style="width: 40px; height: 40px;"></i>
          <p>${message}</p>
        </div>
      `;
    }

    // ACOES DE TAREFA E FORMULARIOS
    function toggleTask(id) {
      triggerHapticFeedback();
      state.tasks = state.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveState();
      render();
    }

    function deleteTask(id) {
      triggerHapticFeedback();
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      showToast('Tarefa removida.');
      render();
    }

    function deleteSubject(id) {
      triggerHapticFeedback();
      state.subjects = state.subjects.filter(s => s.id !== id);
      saveState();
      showToast('Matéria removida.');
      render();
    }

    function openTaskModal() {
      const select = document.getElementById('task-subject-input');
      select.innerHTML = state.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      document.getElementById('task-modal').classList.add('active');
    }

    function openSubjectModal() {
      document.getElementById('subject-modal').classList.add('active');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function handleSaveTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title-input').value;
      const subjectId = document.getElementById('task-subject-input').value;
      const date = document.getElementById('task-date-input').value;
      const priority = document.getElementById('task-priority-input').value;

      const newTask = { id: Date.now().toString(), title, subjectId, date, priority, completed: false };
      state.tasks.push(newTask);
      saveState();
      closeModal('task-modal');
      document.getElementById('task-form').reset();
      showToast('Tarefa criada com sucesso!');
      render();
    }

    function handleSaveSubject(e) {
      e.preventDefault();
      const name = document.getElementById('subject-name-input').value;
      const color = document.getElementById('subject-color-input').value;

      const newSubject = { id: Date.now().toString(), name, color };
      state.subjects.push(newSubject);
      saveState();
      closeModal('subject-modal');
      document.getElementById('subject-form').reset();
      showToast('Matéria cadastrada com sucesso!');
      render();
    }

    function handleSearch(val) {
      state.searchQuery = val;
      render();
    }

    function handleFilterSubject(val) {
      state.filterSubject = val;
      render();
    }

    function handleSaveNotes(val) {
      state.notes = val;
      saveState();
    }

    // BIOMETRIA (WebAuthn / Fallback)
    async function unlockNotes() {
      if (window.PublicKeyCredential) {
        try {
          // Simulando verificação biométrica usando API nativa WebAuthn
          showToast('Solicitando biometria...');
          setTimeout(() => {
            state.notesUnlocked = true;
            render();
            showToast('Acesso concedido!');
          }, 800);
        } catch (err) {
          state.notesUnlocked = true;
          render();
        }
      } else {
        // Fallback para dispositivos sem suporte
        state.notesUnlocked = true;
        render();
      }
    }

    function lockNotes() {
      state.notesUnlocked = false;
      render();
      showToast('Anotações bloqueadas.');
    }

    // ALTERNÂNCIA DE TEMA DARK/LIGHT
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'moon' : 'sun');
      lucide.createIcons();
    }

    // SUPORTE A GESTOS TOUCH (SWIPE / LONG PRESS)
    let touchStartX = 0;
    let touchTimer = null;

    function handleTouchStart(e, taskId) {
      touchStartX = e.touches[0].clientX;
      // Long press simulação para opções rápidas
      touchTimer = setTimeout(() => {
        triggerHapticFeedback();
        if(confirm('Deseja excluir esta tarefa?')) {
          deleteTask(taskId);
        }
      }, 800);
    }

    function handleTouchEnd(e, taskId) {
      clearTimeout(touchTimer);
      const touchEndX = e.changedTouches[0].clientX;
      const diffX = touchEndX - touchStartX;

      // Swipe para direita (Completar)
      if (diffX > 80) {
        toggleTask(taskId);
      }
    }
  </script>
</body>
</html>
